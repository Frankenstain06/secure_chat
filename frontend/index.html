<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <title>Create your account | Secure Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-panel" aria-labelledby="page-title">
        <p class="eyebrow">SECURE CHAT / 001</p>
        <h1 id="page-title">A quieter place to talk.</h1>
        <p class="intro-copy">Create your account and keep your conversations close, considered, and yours.</p>
        <div class="signal" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="status-line"><span class="status-dot"></span>Private by design</p>
      </section>

      <section class="form-panel" aria-labelledby="form-title">
        <div class="form-heading">
          <p class="eyebrow">NEW ACCOUNT</p>
          <h2 id="form-title">Join the conversation</h2>
          <p>Use a few details to get started.</p>
        </div>

        <form id="registration-form" novalidate>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="50" pattern="[a-zA-Z_]+" placeholder="your_username" required />
          <small class="field-hint">3–50 letters and underscores</small>

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" pattern="[a-zA-Z0-9_]+" placeholder="At least 8 characters" required />
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <small class="field-hint">8+ letters, numbers, or underscores</small>

          <button class="submit-button" type="submit">
            <span class="button-label">Create account</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
